# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - Burncup2026

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: burncupbe.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_DC77D48D2B664CD0A78ADFEC67E45A83 }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_9FDB49C3B63049539A7B7F6F10D262BA }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: burncupbe.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_DC77D48D2B664CD0A78ADFEC67E45A83 }}/burncup-be:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    needs: build
    
    steps:
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_7D0FB009A324410CB65445E07FA55469 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_47F84021FF2947E5994C8732A513971F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_58C1B766BC5645ECA53BA5534913F284 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'Burncup2026'
          slot-name: 'Production'
          images: 'burncupbe.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_DC77D48D2B664CD0A78ADFEC67E45A83 }}/burncup-be:${{ github.sha }}'
          